name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: input
    id: where
    attributes:
      label: Where did this happen?
      description: Page, feature, or section of the app
      placeholder: e.g. Dashboard > Licenses page
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How severe is this issue?
      options:
        - Minor annoyance
        - Blocks part of my work
        - Completely blocks my work
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: Drag and drop images here if you have them.
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Email, if you'd like us to follow up with you directly.
      placeholder: you@example.com
    validations:
      required: false
