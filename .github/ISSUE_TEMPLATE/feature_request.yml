name: ✨ Feature Request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please share as much detail as you can.

        > ⚠️ **This report form is only available in English.** Please write your request in English so our team can process it.

  - type: dropdown
    id: app
    attributes:
      label: Which app is this about?
      options:
        - Ninedash
        - Dashboard
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Which device are you using?
      description: Model and OS version, e.g. "iPhone 13, iOS 17.4" or "Samsung Galaxy S21, Android 14"
      placeholder: e.g. iPhone 13, iOS 17.4
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation or pain point that led to this request.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: Describe the feature or change you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
      description: Any workarounds or other solutions you've tried.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would really help
        - Critical for my workflow
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context or screenshots
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Contact (optional)
      description: Email, if you'd like us to follow up with you directly.
      placeholder: you@example.com
    validations:
      required: false
